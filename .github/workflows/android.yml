name: Build Android APK

# Local-first APK: the web app is bundled inside the package, so it runs fully offline.
# Trigger: push a tag like v12.1.0, or run manually (Actions → Build Android APK → Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci

      - name: Build web bundle (root base path for the APK)
        run: VITE_BASE=/ npm run build

      - name: Prepare Android project
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          scripts/android-prepare.sh "$VERSION_NAME" "${{ github.run_number }}"

      - name: Assemble release APK
        working-directory: android
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the real compiler / Gradle errors as an annotation so they are visible without the raw log.
            MSG=$(grep -E "error:|What went wrong|Execution failed|cannot find symbol|symbol:|location:|Manifest merger|Lint found|^> " ../gradle.log | head -40 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${MSG}"
          fi
          exit $code

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          VERSION_NAME=$(node -p "require('./package.json').version")
          OUT="RJ-Tracker-Pro-v${VERSION_NAME}-build${{ github.run_number }}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            "$BT/apksigner" sign --ks release.keystore --ks-key-alias rjtracker --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out "$OUT" aligned.apk
          else
            echo "No signing secrets: using a throw-away debug key (updates won't install over older builds)."
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias dbg -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=debug"
            "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$OUT" aligned.apk
          fi
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK_FILE" --title "RJ Tracker Pro ${TAG}" \
            --notes "Local-first Android APK — the whole app is bundled and works fully offline. Install, then export a Backup from the old app and import it in the new one." \
            || gh release upload "$TAG" "$APK_FILE" --clobber
