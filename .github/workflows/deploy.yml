name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Dependency audit (production, high+; informational)
        run: npm run audit:prod
        continue-on-error: true

      - name: Verify (types + sync server & merge tests)
        run: npm run typecheck && npm run test:server

      - name: Build
        env:
          # Supabase project (Settings → Secrets and variables → Actions → Variables).
          # The anon key is PUBLIC by design — Row-Level Security protects the data.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) export VITE_BASE="/" ;;
            *)           export VITE_BASE="/${REPO}/" ;;
          esac
          echo "Base path: $VITE_BASE"
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
