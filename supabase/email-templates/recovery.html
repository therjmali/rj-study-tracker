<!-- Supabase → Authentication → Email Templates → "Reset Password".
     Subject:  Your RJ Tracker Pro reset code: {{ .Token }}
     The code works inside the app (APK or web). The button opens the web app and is only "used up"
     when you submit a new password, so mail scanners that pre-open links cannot burn it. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:460px;margin:0 auto;padding:28px 22px;color:#1c1612">
  <h2 style="margin:0 0 8px;font-size:20px">Reset your RJ Tracker Pro password</h2>
  <p style="margin:0 0 18px;font-size:14px;line-height:1.5;color:#5a4d40">
    Type this code in the app, on the "Forgot password?" screen:
  </p>
  <p style="margin:0 0 22px;text-align:center;font-size:34px;font-weight:800;letter-spacing:10px;font-family:ui-monospace,Menlo,Consolas,monospace;background:#f6efe3;border-radius:14px;padding:16px 0">
    {{ .Token }}
  </p>
  <p style="margin:0 0 14px;font-size:14px;line-height:1.5;color:#5a4d40">Or open the reset page directly:</p>
  <p style="margin:0 0 22px">
    <a href="{{ .SiteURL }}?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#b4452b;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px">
      Choose a new password
    </a>
  </p>
  <p style="margin:0;font-size:12px;line-height:1.5;color:#8a7b6b">
    The code and the link work once and expire after an hour. Didn't ask for this? Ignore this e-mail — your password stays unchanged.
  </p>
</div>
