<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RJ Tracker Pro — Study Tracker</title>
    <meta name="description" content="RJ Tracker Pro — a private, offline-first study tracker with optional multi-device cloud sync for nursing and agriculture exam preparation: syllabus tracking, spaced repetition, Focus Timer, analytics, reminders and an optional AI tutor." />
    <meta name="theme-color" content="#b4452b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="RJ Tracker Pro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RJ Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Restores deep links that GitHub Pages bounced through 404.html (see vite.config.ts).
      (function () {
        var l = window.location, m = /[?&]__p=([^&#]*)/.exec(l.search);
        if (!m) return;
        var rest = decodeURIComponent(m[1]).replace(/^\//, '');
        window.history.replaceState(null, '', '%BASE_URL%' + rest + l.hash);
      })();
    </script>
    <style>
      /* Instant, brand-matched first paint while the JS bundle loads. */
      html,body{margin:0;background:#ecdfc8;color:#1c1612}
      @media (prefers-color-scheme: dark){html,body{background:#14110e;color:#f3ece1}}
      #boot{position:fixed;inset:0;display:grid;place-items:center;font:600 15px/1.3 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em}
      #boot i{display:block;width:44px;height:44px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#b4452b,#3a2d22);box-shadow:0 10px 30px rgba(180,69,43,.35);animation:rjp 1.4s ease-in-out infinite}
      @keyframes rjp{50%{transform:scale(.9);opacity:.75}}
      /* ── Premium splash: same terracotta field as the native Android launch screen, so there is no flash between them. ── */
      #rj-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(120% 90% at 50% 18%,#cf5a3c 0%,#b4452b 45%,#7d2814 100%);color:#fbf3e6;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;opacity:1;transition:opacity .45s ease,transform .45s ease;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
      #rj-splash.rj-out{opacity:0;transform:scale(1.04);pointer-events:none}
      #rj-splash .rj-halo{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,190,.28) 0%,rgba(255,226,190,0) 68%);animation:rjHalo 3.2s ease-in-out infinite}
      #rj-splash .rj-mark{position:relative;width:112px;height:112px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,240,220,.35);box-shadow:0 18px 50px rgba(60,12,2,.45),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden;animation:rjPop .7s cubic-bezier(.2,.9,.25,1.2) both}
      #rj-splash .rj-mark img{width:100%;height:100%;object-fit:cover;display:block}
      #rj-splash .rj-mark svg{width:64px;height:64px;filter:drop-shadow(0 3px 6px rgba(60,12,2,.35))}
      #rj-splash h1{position:relative;margin:26px 0 0;font-size:27px;font-weight:800;letter-spacing:.01em;animation:rjUp .7s .15s ease both}
      #rj-splash h1 span{font-weight:500;opacity:.8}
      #rj-splash p{position:relative;margin:8px 0 0;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.78;animation:rjUp .7s .28s ease both}
      #rj-splash .rj-bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));width:132px;height:3px;border-radius:3px;background:rgba(255,240,220,.22);overflow:hidden}
      #rj-splash .rj-bar::after{content:"";display:block;height:100%;width:46%;border-radius:3px;background:linear-gradient(90deg,transparent,#ffe9c9,transparent);animation:rjBar 1.25s ease-in-out infinite}
      @keyframes rjPop{from{opacity:0;transform:scale(.72) translateY(8px)}to{opacity:1;transform:none}}
      @keyframes rjUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes rjHalo{50%{transform:scale(1.18);opacity:.65}}
      @keyframes rjBar{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
      @media (prefers-reduced-motion:reduce){#rj-splash *{animation:none!important}#rj-splash{transition:opacity .2s}}
    </style>
  </head>
  <body>
    <div id="rj-splash" role="status" aria-label="Loading RJ Tracker Pro">
      <div class="rj-halo"></div>
      <div class="rj-mark" id="rj-splash-mark">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M32 11 4 25l28 14 28-14L32 11Z" fill="#fbf3e6"/>
          <path d="M16 33v10c0 4.4 7.2 8 16 8s16-3.6 16-8V33L32 42 16 33Z" fill="#f1dfc3"/>
          <path d="M57 28v16" stroke="#fbf3e6" stroke-width="3" stroke-linecap="round"/>
          <circle cx="57" cy="46" r="3" fill="#fbf3e6"/>
        </svg>
      </div>
      <h1>RJ Tracker <span>Pro</span></h1>
      <p>Study smarter</p>
      <div class="rj-bar"></div>
    </div>
    <script>
      // Show the student's own app icon on the splash when they set one.
      (function () {
        try {
          var raw = localStorage.getItem('rj-app-icon-v1');
          var d = raw && JSON.parse(raw);
          if (d && typeof d.dataUrl === 'string' && d.dataUrl.indexOf('data:image/') === 0) {
            var m = document.getElementById('rj-splash-mark');
            m.innerHTML = '';
            var i = new Image(); i.alt = ''; i.src = d.dataUrl; m.appendChild(i);
          }
        } catch (e) {}
        var t0 = Date.now();
        // Called once the app has rendered; keeps the splash up for a minimum moment so it never just flashes.
        window.__rjHideSplash = function () {
          var el = document.getElementById('rj-splash');
          if (!el || el.__going) return;
          el.__going = true;
          setTimeout(function () {
            el.classList.add('rj-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
          }, Math.max(0, 1100 - (Date.now() - t0)));
        };
        setTimeout(function () { window.__rjHideSplash && window.__rjHideSplash(); }, 7000); // never get stuck
      })();
    </script>
    <div id="root"><div id="boot"><div style="text-align:center"><i></i>RJ Tracker Pro</div></div></div>
    <noscript>RJ Tracker Pro needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
