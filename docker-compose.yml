# Self-hosted cloud sync for RJ Tracker Pro.
#
#   CLOUD_SECRET=$(openssl rand -base64 48) docker compose up -d
#
# Then point the app at http://<this-host>:8787 (use HTTPS in production —
# put Caddy or nginx in front, or set SERVER_NAME with a Caddy sidecar).
services:
  sync:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: rj-tracker-sync:latest
    container_name: rj-sync
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      # Required in production: keeps sessions valid across restarts.
      CLOUD_SECRET: ${CLOUD_SECRET:?set CLOUD_SECRET to a long random string}
      # Optional: restrict browsers that may call the API.
      CLOUD_ORIGINS: ${CLOUD_ORIGINS:-*}
    volumes:
      - rj-sync-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rj-sync-data:
